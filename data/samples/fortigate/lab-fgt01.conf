#config-version=FGT60F-7.4.4-FW-build2662:opmode=0:vdom=0
#SYNTHETIC lab config for fwlens. Not from any real network.
#Addresses: RFC1918 (10.0.0.0/8) and documentation ranges (198.51.100.0/24, example.org).
#
#Seeded flaws (ground truth for later evals):
#  allow-ssh-jump      SHADOWED by allow-ssh-admins (h-web01 is a member of grp-web)
#  allow-ntp           LOGGING OFF on an allow rule
#  allow-web-out-copy  DUPLICATE of allow-web-out
#  old-ftp-access      DISABLED rule; h-ftp01 is referenced only here
#  temp-vendor-access  ANY-ANY allow (all source, destination, service)
#  grp-blocklist       contains h-decom, which no longer exists (unresolved member)
#Parser checks:
#  policy 12 sits before 10 and 11: FortiGate evaluates in config order, not by ID
#  policy 10 has no "set action": FortiOS defaults to deny
#  policy 11 has no name: falls back to the policy ID
config system global
    set alias "FortiGate-60F"
    set hostname "lab-fgt01"
end
config firewall address
    edit "all"
    next
    edit "net-users"
        set subnet 10.20.10.0 255.255.255.0
    next
    edit "net-servers"
        set subnet 10.20.40.0 255.255.255.0
    next
    edit "h-admin-ws"
        set subnet 10.20.10.50 255.255.255.255
    next
    edit "h-web01"
        set subnet 10.20.20.11 255.255.255.255
    next
    edit "h-web02"
        set subnet 10.20.20.12 255.255.255.255
    next
    edit "h-ftp01"
        set subnet 10.20.20.30 255.255.255.255
    next
    edit "r-bad-range"
        set type iprange
        set start-ip 198.51.100.10
        set end-ip 198.51.100.20
    next
    edit "f-bad-domain"
        set type fqdn
        set fqdn "bad.example.org"
    next
end
config firewall addrgrp
    edit "grp-web"
        set member "h-web01" "h-web02"
    next
    edit "grp-blocklist"
        set member "r-bad-range" "f-bad-domain" "h-decom"
    next
end
config firewall service custom
    edit "ALL"
        set protocol IP
    next
    edit "DNS"
        set tcp-portrange 53
        set udp-portrange 53
    next
    edit "HTTP"
        set tcp-portrange 80
    next
    edit "HTTPS"
        set tcp-portrange 443
    next
    edit "SSH"
        set tcp-portrange 22
    next
    edit "NTP"
        set tcp-portrange 123
        set udp-portrange 123
    next
    edit "FTP"
        set tcp-portrange 21
    next
    edit "PING"
        set protocol ICMP
        set icmptype 8
    next
    edit "tcp-8443"
        set tcp-portrange 8443
    next
end
config firewall service group
    edit "sg-web"
        set member "HTTPS" "tcp-8443"
    next
end
config firewall policy
    edit 1
        set name "allow-dns"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "net-users"
        set dstaddr "all"
        set schedule "always"
        set service "DNS"
        set logtraffic all
    next
    edit 2
        set name "allow-web-out"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "net-users"
        set dstaddr "all"
        set schedule "always"
        set service "HTTP" "HTTPS"
        set logtraffic all
    next
    edit 3
        set name "allow-web-in"
        set srcintf "wan1"
        set dstintf "dmz"
        set action accept
        set srcaddr "all"
        set dstaddr "grp-web"
        set schedule "always"
        set service "sg-web"
        set logtraffic all
    next
    edit 4
        set name "allow-ssh-admins"
        set srcintf "internal"
        set dstintf "dmz"
        set action accept
        set srcaddr "h-admin-ws"
        set dstaddr "grp-web"
        set schedule "always"
        set service "SSH"
        set logtraffic all
    next
    edit 5
        set name "allow-ssh-jump"
        set srcintf "internal"
        set dstintf "dmz"
        set action accept
        set srcaddr "h-admin-ws"
        set dstaddr "h-web01"
        set schedule "always"
        set service "SSH"
        set logtraffic all
    next
    edit 6
        set name "allow-ntp"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "net-servers"
        set dstaddr "all"
        set schedule "always"
        set service "NTP"
        set logtraffic disable
    next
    edit 7
        set name "allow-web-out-copy"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "net-users"
        set dstaddr "all"
        set schedule "always"
        set service "HTTP" "HTTPS"
        set logtraffic all
    next
    edit 8
        set name "old-ftp-access"
        set srcintf "internal"
        set dstintf "dmz"
        set action accept
        set status disable
        set srcaddr "net-users"
        set dstaddr "h-ftp01"
        set schedule "always"
        set service "FTP"
        set logtraffic all
    next
    edit 12
        set name "temp-vendor-access"
        set srcintf "wan1"
        set dstintf "dmz"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set comments "Ticket \"CHG-1042\": temporary vendor access"
    next
    edit 10
        set name "deny-blocklist"
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "grp-blocklist"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 11
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "h-admin-ws"
        set dstaddr "all"
        set schedule "always"
        set service "PING"
        set logtraffic all
    next
end
