[project]
name = "fwlens"
version = "0.1.0"
description = "AI assistant for firewall configs and security logs"
readme = "README.md"
authors = [
    { name = "Mehrad Esmi", email = "esmimehrad@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.43.126",
    "lxml>=6.1.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
fwlens = "fwlens.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: pyupgrade, SIM: simplify
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["db: needs Postgres (skipped if unreachable, unless FWLENS_REQUIRE_DB=1)"]
