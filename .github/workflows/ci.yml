name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Same image as docker-compose.yml, for the db-marked integration tests.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fwlens
          POSTGRES_PASSWORD: fwlens
          POSTGRES_DB: fwlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fwlens -d fwlens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # In CI, an unreachable database fails the db tests instead of skipping them.
      FWLENS_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # uv reads .python-version (3.12) and installs it
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

  # Step 14 adds: docker build + push to ECR
